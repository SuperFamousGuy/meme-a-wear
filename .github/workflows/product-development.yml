name: Product development

on:
  schedule:
    - cron: "0 13 * * 1" # Mondays 13:00 UTC
  workflow_dispatch:
    inputs:
      focus:
        description: Optional trend focus
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: product-development

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-claude-plugins
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      # A CI run was blocked at the skill's step 5 git add despite the
      # skill's own grants, so grant its git and gh commands here too. The
      # subagents' Bash calls must also pass their shell-guard hooks.
      - name: Run /product-development
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          FOCUS: ${{ inputs.focus }}
        run: |
          claude -p "/product-development $FOCUS" \
            --permission-mode acceptEdits \
            --allowedTools "Agent" "Skill" "WebSearch" "WebFetch" \
              "Bash(node .claude/scripts/last30days.mjs *)" \
              "Bash(curl -sfL *)" "Bash(ffmpeg *)" "Bash(rm trends/refs/*)" \
              "Bash(mv trends/*)" "Bash(mv designs/*)" "Bash(mv marketing/*)" \
              "Bash(mkdir -p designs/no-go)" "Bash(grep -r *)" \
              "Bash(git status *)" "Bash(git fetch *)" "Bash(git switch *)" \
              "Bash(git add *)" "Bash(git commit *)" "Bash(git push *)" \
              "Bash(gh auth status)" "Bash(gh pr create *)" "Bash(date *)" \
            < /dev/null
      # claude -p exits 0 even when the skill stops before its PR.
      - name: Check the run committed its work
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::The run left uncommitted changes and opened no PR."
            exit 1
          fi
