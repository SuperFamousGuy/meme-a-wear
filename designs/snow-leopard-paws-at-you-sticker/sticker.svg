<?xml version="1.0" encoding="UTF-8"?>
<!--
  Snow Leopard Paws at You Sticker, die-cut, 3 x 3 in, digital print.
  Hand-written SVG fallback: Higgsfield had no image credits (2026-11-02).
  Units: 1000 per inch. Canvas 3.25 in = 3 in trim + 0.125 in bleed per side.
  Layers, bottom to top:
    bleed-border  Chalk die-cut border plus 0.125 in bleed past the cut line
    caption       "*PAWS AT YOU*", Archivo Black, Ink. Convert to outlines before print.
    leopard       original flat vector drawing
    CutContour    die-cut line. Non-printing. Hide before RIP or map to the printer's cut spot.
  Palette: Ink #141414, Chalk #F2F2EE, Smoke #6B6B66, Yolk #F2C14E.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="3.25in" height="3.25in" viewBox="0 0 3250 3250">
  <title>Snow Leopard Paws at You Sticker</title>
  <defs>
    <path id="cut" d="M 253 1086 C 330 1260 600 1300 690 1480 L 690 2900 C 690 3060 760 3100 900 3100 L 2350 3100 C 2490 3100 2560 3060 2560 2900 L 2560 1480 C 2650 1300 2920 1260 2997 1086 A 1480 1480 0 0 0 253 1086 Z"/>
    <path id="captionArc" d="M 475 1640 A 1150 1150 0 0 1 2775 1640"/>
    <path id="blotch" d="M 0 -60 C 50 -70 90 -30 80 10 C 70 55 20 70 -20 60 C -70 50 -90 10 -70 -30 C -55 -60 -30 -55 0 -60 Z"/>
  </defs>

  <g id="bleed-border">
    <use xlink:href="#cut" href="#cut" fill="#F2F2EE" stroke="#F2F2EE" stroke-width="250" stroke-linejoin="round"/>
  </g>

  <g id="caption">
    <text font-family="'Archivo Black', 'Arial Black', sans-serif" font-size="260" fill="#141414" text-anchor="middle">
      <textPath xlink:href="#captionArc" href="#captionArc" startOffset="50%" textLength="2150" lengthAdjust="spacingAndGlyphs">*PAWS AT YOU*</textPath>
    </text>
  </g>

  <g id="leopard" stroke-linecap="round" stroke-linejoin="round">
    <!-- ears -->
    <g stroke="#141414" stroke-width="22">
      <path fill="#F2F2EE" d="M 970 1150 C 930 980 970 790 1070 755 C 1170 730 1310 800 1400 880 Z"/>
      <path fill="#F2F2EE" d="M 2280 1150 C 2320 980 2280 790 2180 755 C 2080 730 1940 800 1850 880 Z"/>
    </g>
    <path fill="#6B6B66" d="M 1030 1080 C 1010 960 1040 850 1090 830 C 1160 815 1250 860 1310 900 Z"/>
    <path fill="#6B6B66" d="M 2220 1080 C 2240 960 2210 850 2160 830 C 2090 815 2000 860 1940 900 Z"/>

    <!-- body and chest blotches -->
    <path fill="#F2F2EE" stroke="#141414" stroke-width="22" d="M 1010 1600 C 900 2000 830 2500 850 2880 Q 855 2960 940 2960 L 2310 2960 Q 2395 2960 2400 2880 C 2420 2500 2350 2000 2240 1600 Z"/>
    <g fill="#141414">
      <use xlink:href="#blotch" href="#blotch" transform="translate(1180 2000) rotate(20) scale(0.7)"/>
      <use xlink:href="#blotch" href="#blotch" transform="translate(1080 2170) rotate(-15) scale(1.1)"/>
      <use xlink:href="#blotch" href="#blotch" transform="translate(990 2450) rotate(40) scale(0.9)"/>
      <use xlink:href="#blotch" href="#blotch" transform="translate(1160 2560) rotate(-30) scale(1.0)"/>
      <use xlink:href="#blotch" href="#blotch" transform="translate(1010 2790) rotate(10) scale(0.9)"/>
      <use xlink:href="#blotch" href="#blotch" transform="translate(1230 2850) rotate(70) scale(0.7)"/>
      <use xlink:href="#blotch" href="#blotch" transform="translate(2170 2150) rotate(165) scale(1.1)"/>
      <use xlink:href="#blotch" href="#blotch" transform="translate(2270 2450) rotate(-40) scale(0.9)"/>
      <use xlink:href="#blotch" href="#blotch" transform="translate(2120 2650) rotate(200) scale(1.0)"/>
      <use xlink:href="#blotch" href="#blotch" transform="translate(2260 2800) rotate(-10) scale(0.9)"/>
    </g>
    <!-- Smoke shadow under the chin -->
    <ellipse cx="1625" cy="1930" rx="600" ry="90" fill="#6B6B66"/>

    <!-- head -->
    <path fill="#F2F2EE" stroke="#141414" stroke-width="22" d="M 1625 790 C 2050 790 2360 1000 2370 1380 C 2380 1700 2080 1900 1625 1900 C 1170 1900 870 1700 880 1380 C 890 1000 1200 790 1625 790 Z"/>
    <!-- small head spots -->
    <g fill="#141414">
      <circle cx="1625" cy="900" r="34"/>
      <circle cx="1530" cy="960" r="26"/>
      <circle cx="1720" cy="960" r="26"/>
      <circle cx="1625" cy="1010" r="24"/>
      <circle cx="1470" cy="1050" r="22"/>
      <circle cx="1780" cy="1050" r="22"/>
      <circle cx="1625" cy="1110" r="20"/>
      <circle cx="1390" cy="880" r="28"/>
      <circle cx="1860" cy="880" r="28"/>
      <circle cx="1220" cy="980" r="24"/>
      <circle cx="2030" cy="980" r="24"/>
      <circle cx="1000" cy="1420" r="18"/>
      <circle cx="2250" cy="1420" r="18"/>
      <circle cx="980" cy="1520" r="20"/>
      <circle cx="2270" cy="1520" r="20"/>
    </g>
    <!-- huge round glossy eyes: Smoke rim, Ink eye, Yolk catchlight, Chalk glint -->
    <circle cx="1300" cy="1290" r="260" fill="#6B6B66"/>
    <circle cx="1950" cy="1290" r="260" fill="#6B6B66"/>
    <circle cx="1300" cy="1290" r="235" fill="#141414"/>
    <circle cx="1950" cy="1290" r="235" fill="#141414"/>
    <circle cx="1215" cy="1195" r="60" fill="#F2C14E"/>
    <circle cx="1865" cy="1195" r="60" fill="#F2C14E"/>
    <circle cx="1390" cy="1375" r="26" fill="#F2F2EE"/>
    <circle cx="2040" cy="1375" r="26" fill="#F2F2EE"/>
    <!-- small nose and closed neutral mouth, low on the face -->
    <path fill="#141414" d="M 1545 1530 C 1545 1505 1705 1505 1705 1530 C 1705 1575 1650 1610 1625 1610 C 1600 1610 1545 1575 1545 1530 Z"/>
    <path fill="none" stroke="#141414" stroke-width="20" d="M 1625 1610 L 1625 1650 M 1540 1660 C 1570 1690 1610 1680 1625 1650 C 1640 1680 1680 1690 1710 1660"/>
    <!-- whisker dots and thin whiskers -->
    <g fill="#6B6B66">
      <circle cx="1530" cy="1610" r="10"/>
      <circle cx="1500" cy="1645" r="10"/>
      <circle cx="1720" cy="1610" r="10"/>
      <circle cx="1750" cy="1645" r="10"/>
    </g>
    <g fill="none" stroke="#6B6B66" stroke-width="12">
      <path d="M 1470 1620 Q 1250 1570 1000 1560"/>
      <path d="M 1470 1650 Q 1250 1640 990 1660"/>
      <path d="M 1480 1680 Q 1270 1710 1060 1755"/>
      <path d="M 1780 1620 Q 2000 1570 2250 1560"/>
      <path d="M 1780 1650 Q 2000 1640 2260 1660"/>
      <path d="M 1770 1680 Q 1980 1710 2190 1755"/>
    </g>

    <!-- raised leg with larger blotches -->
    <path fill="#F2F2EE" stroke="#141414" stroke-width="22" d="M 1440 2400 C 1420 2650 1400 2850 1390 2960 L 2010 2960 C 2000 2850 1980 2650 1960 2400 Z"/>
    <g fill="#141414">
      <use xlink:href="#blotch" href="#blotch" transform="translate(1520 2780) rotate(25) scale(0.9)"/>
      <use xlink:href="#blotch" href="#blotch" transform="translate(1870 2740) rotate(-50) scale(0.8)"/>
      <use xlink:href="#blotch" href="#blotch" transform="translate(1700 2895) rotate(90) scale(0.6)"/>
    </g>

    <!-- oversized paw pushed at the viewer, overlapping the chin -->
    <path fill="#F2F2EE" stroke="#141414" stroke-width="22" d="M 1700 1830 C 1990 1830 2130 1990 2120 2230 C 2110 2450 1960 2600 1700 2600 C 1440 2600 1290 2450 1280 2230 C 1270 1990 1410 1830 1700 1830 Z"/>
    <g fill="none" stroke="#6B6B66" stroke-width="14">
      <path d="M 1515 2050 L 1480 1950"/>
      <path d="M 1700 1985 L 1700 1870"/>
      <path d="M 1885 2050 L 1920 1950"/>
    </g>
    <g fill="#141414">
      <ellipse cx="1450" cy="2140" rx="80" ry="95" transform="rotate(-25 1450 2140)"/>
      <ellipse cx="1600" cy="2020" rx="85" ry="100" transform="rotate(-8 1600 2020)"/>
      <ellipse cx="1800" cy="2020" rx="85" ry="100" transform="rotate(8 1800 2020)"/>
      <ellipse cx="1950" cy="2140" rx="80" ry="95" transform="rotate(25 1950 2140)"/>
      <path d="M 1700 2230 C 1820 2230 1900 2320 1910 2420 C 1920 2500 1850 2520 1800 2500 C 1750 2480 1650 2480 1600 2500 C 1550 2520 1480 2500 1490 2420 C 1500 2320 1580 2230 1700 2230 Z"/>
    </g>
  </g>

  <g id="CutContour">
    <!-- Non-printing die-cut line, 0.125 in inside the bleed edge. -->
    <use xlink:href="#cut" href="#cut" fill="none" stroke="#FF00FF" stroke-width="4"/>
  </g>
</svg>
