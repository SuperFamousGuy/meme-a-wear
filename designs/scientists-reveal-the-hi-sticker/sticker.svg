<?xml version="1.0" encoding="UTF-8"?>
<!--
  Scientists Reveal the Hi Sticker, rectangular kiss-cut with rounded corners, 3 x 3 in, digital print.
  Hand-written SVG fallback: Higgsfield had 1 credit and an image job costs about 3 (2026-11-02).
  Units: 1000 per inch. Canvas 3.25 in = 3 in trim + 0.125 in bleed per side.
  Safe area: 250 to 3000 on both axes (0.125 in inside the cut line).
  Layers, bottom to top:
    panel       Ink panel, full bleed
    cat         original flat vector cat, same design as the sibling tee and mug
    headline    "Scientists reveal the" in a generic bold serif, Chalk. Convert to outlines before print.
    hi-box      Chalk rounded box with "Hi" in Archivo Black, Ink. Convert to outlines before print.
    CutContour  kiss-cut line. Non-printing. Hide before RIP or map to the printer's cut spot.
  Palette: Ink #141414, Chalk #F2F2EE, Yolk #F2C14E.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="3.25in" height="3.25in" viewBox="0 0 3250 3250">
  <title>Scientists Reveal the Hi Sticker</title>
  <defs>
    <path id="earL" d="M 620 1100 L 745 350 Q 775 280 835 325 L 1260 760 Z"/>
    <path id="earR" d="M 2630 1100 L 2505 350 Q 2475 280 2415 325 L 1990 760 Z"/>
    <path id="head" d="M 1625 620 C 2250 620 2780 1000 2780 1600 C 2780 2050 2520 2340 2260 2440 L 2320 2620 L 930 2620 L 990 2440 C 730 2340 470 2050 470 1600 C 470 1000 1000 620 1625 620 Z"/>
    <clipPath id="catClip">
      <use xlink:href="#head" href="#head"/>
      <use xlink:href="#earL" href="#earL"/>
      <use xlink:href="#earR" href="#earR"/>
    </clipPath>
    <!-- tapered tabby stripe, 340 long, pointing +x -->
    <path id="stripe" d="M 0 -42 Q 170 -30 340 0 Q 170 30 0 42 Q 18 0 0 -42 Z"/>
    <g id="sideStripes">
      <use xlink:href="#stripe" href="#stripe" transform="translate(440 1250) rotate(5)"/>
      <use xlink:href="#stripe" href="#stripe" transform="translate(430 1480) rotate(0) scale(1.05 1)"/>
      <use xlink:href="#stripe" href="#stripe" transform="translate(440 1720) rotate(-4)"/>
      <use xlink:href="#stripe" href="#stripe" transform="translate(480 1960) rotate(-10) scale(1.1 1)"/>
      <use xlink:href="#stripe" href="#stripe" transform="translate(600 2220) rotate(-18)"/>
      <use xlink:href="#stripe" href="#stripe" transform="translate(900 2440) rotate(-25) scale(0.9 0.9)"/>
      <use xlink:href="#stripe" href="#stripe" transform="translate(1230 760) rotate(60) scale(0.8 0.8)"/>
      <use xlink:href="#stripe" href="#stripe" transform="translate(1420 680) rotate(78) scale(1 0.9)"/>
    </g>
    <g id="earTufts" fill="none" stroke="#141414" stroke-width="24" stroke-linecap="round">
      <path d="M 790 560 Q 880 640 960 760"/>
      <path d="M 770 720 Q 860 790 920 900"/>
      <path d="M 850 450 Q 960 560 1060 660"/>
    </g>
    <g id="whiskers" fill="none" stroke="#F2F2EE" stroke-width="18" stroke-linecap="round">
      <path d="M 1240 2080 Q 800 1960 300 1950"/>
      <path d="M 1235 2140 Q 800 2100 280 2180"/>
      <path d="M 1245 2200 Q 850 2250 330 2420"/>
      <path d="M 1270 2260 Q 950 2380 560 2600"/>
    </g>
    <g id="eye">
      <circle r="300" fill="#141414"/>
      <circle r="272" fill="#F2C14E"/>
      <circle r="250" fill="#141414"/>
      <circle cx="90" cy="-110" r="52" fill="#F2F2EE"/>
      <circle cx="-105" cy="115" r="20" fill="#F2F2EE"/>
    </g>
  </defs>

  <g id="panel">
    <rect x="0" y="0" width="3250" height="3250" fill="#141414"/>
  </g>

  <g id="cat" stroke-linejoin="round">
    <!-- Chalk outline: 100-unit stroke behind the fills leaves 0.05 in outside the silhouette -->
    <g fill="#F2F2EE" stroke="#F2F2EE" stroke-width="100">
      <use xlink:href="#earL" href="#earL"/>
      <use xlink:href="#earR" href="#earR"/>
      <use xlink:href="#head" href="#head"/>
    </g>
    <g fill="#F2C14E">
      <use xlink:href="#earL" href="#earL"/>
      <use xlink:href="#earR" href="#earR"/>
      <use xlink:href="#head" href="#head"/>
    </g>
    <use xlink:href="#earTufts" href="#earTufts"/>
    <use xlink:href="#earTufts" href="#earTufts" transform="translate(3250 0) scale(-1 1)"/>
    <g fill="#141414" clip-path="url(#catClip)">
      <use xlink:href="#stripe" href="#stripe" transform="translate(1625 640) rotate(90) scale(1.15 1)"/>
      <use xlink:href="#sideStripes" href="#sideStripes"/>
      <use xlink:href="#sideStripes" href="#sideStripes" transform="translate(3250 0) scale(-1 1)"/>
    </g>
    <!-- huge round glossy eyes: pupils fill almost all of each eye -->
    <use xlink:href="#eye" href="#eye" transform="translate(1150 1420)"/>
    <use xlink:href="#eye" href="#eye" transform="translate(2100 1420)"/>
    <!-- Chalk muzzle and chin -->
    <path fill="#F2F2EE" d="M 1625 1880 C 1900 1860 2050 2000 2030 2180 C 2010 2380 1800 2460 1625 2460 C 1450 2460 1240 2380 1220 2180 C 1200 2000 1350 1860 1625 1880 Z"/>
    <!-- small Chalk nose, closed neutral mouth -->
    <path fill="#F2F2EE" stroke="#141414" stroke-width="22" d="M 1530 1780 Q 1625 1750 1720 1780 Q 1745 1800 1710 1840 L 1625 1910 L 1540 1840 Q 1505 1800 1530 1780 Z"/>
    <path fill="none" stroke="#141414" stroke-width="22" stroke-linecap="round" d="M 1625 1910 L 1625 1990 M 1500 2050 Q 1570 2040 1625 1990 Q 1680 2040 1750 2050"/>
    <g fill="#141414">
      <circle cx="1440" cy="2060" r="12"/>
      <circle cx="1400" cy="2110" r="12"/>
      <circle cx="1810" cy="2060" r="12"/>
      <circle cx="1850" cy="2110" r="12"/>
    </g>
    <!-- long whiskers spreading past the face -->
    <use xlink:href="#whiskers" href="#whiskers"/>
    <use xlink:href="#whiskers" href="#whiskers" transform="translate(3250 0) scale(-1 1)"/>
  </g>

  <g id="headline">
    <text x="270" y="2880" font-family="'Source Serif 4', Georgia, 'Times New Roman', serif" font-weight="700" font-size="200" fill="#F2F2EE" textLength="2080" lengthAdjust="spacingAndGlyphs">Scientists reveal the</text>
    <!-- start of the original last word, cut off by the pasted box -->
    <text x="2385" y="2880" font-family="'Source Serif 4', Georgia, 'Times New Roman', serif" font-weight="700" font-size="200" fill="#F2F2EE">s</text>
  </g>

  <g id="hi-box">
    <rect x="2430" y="2580" width="560" height="400" rx="60" fill="#F2F2EE"/>
    <text x="2710" y="2900" text-anchor="middle" font-family="'Archivo Black', 'Arial Black', sans-serif" font-size="330" fill="#141414">Hi</text>
  </g>

  <g id="CutContour">
    <!-- Non-printing kiss-cut line at the 3 in trim, corner radius 0.15 in. -->
    <rect x="125" y="125" width="3000" height="3000" rx="150" fill="none" stroke="#FF00FF" stroke-width="4"/>
  </g>
</svg>
