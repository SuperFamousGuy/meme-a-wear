  <g fill="none" stroke="#6B6B66" stroke-width="4" stroke-linecap="round">
    <path d="M530 560 Q460 548 340 538"/>
    <path d="M530 570 Q460 572 342 590"/>
    <path d="M532 580 Q470 595 360 632"/>
    <path d="M670 560 Q740 548 860 538"/>
    <path d="M670 570 Q740 572 858 590"/>
    <path d="M668 580 Q730 595 840 632"/>
