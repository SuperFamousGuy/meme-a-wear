    <line x1="627" y1="888" x2="660" y2="800" stroke="#141414" stroke-width="22"/>
    <line x1="610" y1="890" x2="630" y2="778" stroke="#6B6B66" stroke-width="30"/>
    <line x1="610" y1="890" x2="630" y2="778" stroke="#141414" stroke-width="22"/>
    <line x1="593" y1="895" x2="600" y2="770" stroke="#6B6B66" stroke-width="30"/>
    <line x1="593" y1="895" x2="600" y2="770" stroke="#141414" stroke-width="22"/>
    <line x1="577" y1="902" x2="569" y2="790" stroke="#6B6B66" stroke-width="30"/>
    <line x1="577" y1="902" x2="569" y2="790" stroke="#141414" stroke-width="22"/>
  </g>
  <path d="M705 1070 L655 1080 C620 1050 595 1030 585 1005 L573 905 L635 882 C670 930 695 1000 705 1070 Z" fill="#141414" stroke="#6B6B66" stroke-width="6" stroke-linejoin="round"/>
  <g stroke-linecap="round">
    <line x1="583" y1="990" x2="547" y2="930" stroke="#6B6B66" stroke-width="32"/>
    <line x1="583" y1="990" x2="547" y2="930" stroke="#141414" stroke-width="24"/>
  </g>

  <!-- Caption -->
  <g font-family="Archivo Black" font-size="140" text-anchor="middle" fill="#141414">
    <text x="600" y="1400">BAD IDEA.</text>
    <text x="600" y="1550">LOVE IT.</text>
  </g>
</svg>
