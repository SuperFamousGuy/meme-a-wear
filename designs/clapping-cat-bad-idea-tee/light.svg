  <path d="M578 520 L622 520 Q612 540 600 546 Q588 540 578 520 Z" fill="#141414" stroke="#6B6B66" stroke-width="4" stroke-linejoin="round"/>
  <line x1="600" y1="546" x2="600" y2="584" stroke="#6B6B66" stroke-width="4" stroke-linecap="round"/>

