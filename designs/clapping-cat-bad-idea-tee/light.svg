<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="12in" height="16in">
  <!-- Light garments: white, ash, sand. Transparent background: no garment-color fill. -->
  <!-- Colors: Ink #141414, Chalk #F2F2EE, Yolk #F2C14E, Smoke #6B6B66. Font: Archivo Black (SIL OFL 1.1). -->
  <!-- Original drawing. Not traced from any frame. -->

  <!-- Silhouette: slim upright torso with neck, then angular head -->
  <g fill="#141414">
    <path d="M480 600 C470 680 430 730 400 790 C370 860 360 1000 375 1120 C385 1190 400 1230 420 1240 L780 1240 C800 1230 815 1190 825 1120 C840 1000 830 860 800 790 C770 730 730 680 720 600 Z"/>
    <path d="M395 370 L430 130 L530 265 Q600 245 670 265 L770 130 L805 370 C825 420 825 500 790 560 C750 620 680 655 600 660 C520 655 450 620 410 560 C375 500 375 420 395 370 Z"/>
  </g>

