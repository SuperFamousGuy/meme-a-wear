    <path d="M600 685 L600 722"/>
    <path d="M640 690 L630 720"/>
    <path d="M580 730 L588 758"/>
    <path d="M620 730 L612 758"/>
    <path d="M412 805 C388 870 380 980 388 1100"/>
    <path d="M788 805 C812 870 820 980 812 1100"/>
  </g>

  <!-- Eyes: half-closed, lids lowered -->
  <g fill="#F2C14E">
    <path d="M440 432 Q500 428 562 450 Q505 478 440 432 Z"/>
    <path d="M760 432 Q700 428 638 450 Q695 478 760 432 Z"/>
