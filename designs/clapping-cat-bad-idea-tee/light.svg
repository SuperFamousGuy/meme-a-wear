  <path d="M540 578 Q600 600 660 578 Q648 622 600 624 Q552 622 540 578 Z" fill="#141414" stroke="#6B6B66" stroke-width="4" stroke-linejoin="round"/>
  <path d="M552 588 Q600 604 648 588 L645 607 Q600 616 555 607 Z" fill="#F2F2EE"/>
  <g stroke="#141414" stroke-width="4">
