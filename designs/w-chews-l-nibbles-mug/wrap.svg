<?xml version="1.0" encoding="UTF-8"?>
<!--
  W Chews / L Nibbles mug, 11 oz wrap, 8.5 x 3.5 in, sublimation on white ceramic.
  Hand-written SVG fallback: Higgsfield had 1 credit (2026-11-02), and an image job costs about 3.
  Units: 1000 per inch. The wrap's left and right edges meet at the handle seam.
  Panels: side A "W chews" centered at x 2.125 in, side B "L nibbles" centered at x 6.375 in.
  Each panel reuses the bowl, chunk, and caption geometry of
  designs/w-chews-l-nibbles-button-set/w.svg and l.svg, scaled 1.3x.
  All art sits at least 0.38 in from the top and bottom edges and 0.72 in from the handle seam.
  Layers, bottom to top:
    background  Chalk. Removable: hide before print so the white ceramic shows.
    side-a      "W chews", Ink caption, heaped bowl with Yolk glaze, Ink outlines
    side-b      "L nibbles", Ink caption, Ink bowl, empty but for one sad piece
  Captions are live text in Archivo Black. Convert to outlines before print.
  Palette: Ink #141414, Chalk #F2F2EE, Yolk #F2C14E. Yolk appears only in non-text shapes, each with an Ink edge.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="8.5in" height="3.5in" viewBox="0 0 8500 3500">
  <title>W Chews / L Nibbles Mug Wrap</title>
  <defs>
    <path id="chunk-shape" d="M -150 -20 C -150 -100 -60 -125 10 -115 C 90 -110 155 -70 150 10 C 145 85 70 115 -10 112 C -100 108 -150 60 -150 -20 Z"/>
    <!-- one glazed chunk: Yolk with Ink edge, Chalk gloss, Ink sesame seeds (same as w.svg) -->
    <g id="chunk">
      <use xlink:href="#chunk-shape" href="#chunk-shape" fill="#F2C14E" stroke="#141414" stroke-width="24" stroke-linejoin="round"/>
      <path d="M -85 -60 C -45 -88 15 -90 60 -72" fill="none" stroke="#F2F2EE" stroke-width="24" stroke-linecap="round"/>
      <g fill="#141414">
        <ellipse cx="-30" cy="20" rx="17" ry="9" transform="rotate(-25 -30 20)"/>
        <ellipse cx="55" cy="-10" rx="17" ry="9" transform="rotate(30 55 -10)"/>
        <ellipse cx="20" cy="65" rx="17" ry="9" transform="rotate(5 20 65)"/>
      </g>
    </g>
  </defs>

  <g id="background">
    <rect x="0" y="0" width="8500" height="3500" fill="#F2F2EE"/>
  </g>

  <!-- Side A. Panel art uses sticker coordinates: center (1625, 1680) maps to (2125, 1750). -->
  <g id="side-a" transform="translate(2125 1750) scale(1.3) translate(-1625 -1680)">
    <text x="1625" y="950" font-family="'Archivo Black', 'Arial Black', sans-serif" font-size="440" fill="#141414" text-anchor="middle" textLength="2150" lengthAdjust="spacingAndGlyphs">W chews</text>
    <g stroke-linecap="round" stroke-linejoin="round">
      <!-- back of the rim, then a rice dome -->
      <ellipse cx="1625" cy="1900" rx="775" ry="110" fill="#F2F2EE" stroke="#141414" stroke-width="28"/>
      <path d="M 900 1900 C 950 1500 2300 1500 2350 1900 Z" fill="#F2F2EE" stroke="#141414" stroke-width="20"/>
      <!-- heaped chunks, back row to front row -->
      <use xlink:href="#chunk" href="#chunk" transform="translate(1300 1520) rotate(-10) scale(0.9)"/>
      <use xlink:href="#chunk" href="#chunk" transform="translate(1950 1520) rotate(12) scale(0.9)"/>
      <use xlink:href="#chunk" href="#chunk" transform="translate(1625 1440)"/>
      <use xlink:href="#chunk" href="#chunk" transform="translate(1100 1760) rotate(8) scale(0.9)"/>
      <use xlink:href="#chunk" href="#chunk" transform="translate(2150 1760) rotate(-15) scale(0.9)"/>
      <use xlink:href="#chunk" href="#chunk" transform="translate(1420 1690) rotate(20) scale(1.05)"/>
      <use xlink:href="#chunk" href="#chunk" transform="translate(1800 1690) rotate(-6) scale(1.05)"/>
      <use xlink:href="#chunk" href="#chunk" transform="translate(1250 1900) rotate(-18) scale(1.0)"/>
      <use xlink:href="#chunk" href="#chunk" transform="translate(2000 1900) rotate(15) scale(1.0)"/>
      <use xlink:href="#chunk" href="#chunk" transform="translate(1625 1880) rotate(4) scale(1.1)"/>
      <!-- bowl foot and front, Chalk with Ink outline so the bowl reads on a white mug -->
      <rect x="1350" y="2560" width="550" height="160" rx="40" fill="#F2F2EE" stroke="#141414" stroke-width="28"/>
      <path d="M 850 1900 A 775 110 0 0 0 2400 1900 C 2380 2350 2100 2620 1625 2620 C 1150 2620 870 2350 850 1900 Z" fill="#F2F2EE" stroke="#141414" stroke-width="28"/>
      <path d="M 900 1945 A 725 100 0 0 0 2350 1945" fill="none" stroke="#141414" stroke-width="18"/>
      <!-- glossy glaze drips over the front rim -->
      <g fill="#F2C14E" stroke="#141414" stroke-width="18">
        <path d="M 1400 2000 C 1400 2080 1415 2150 1440 2150 C 1465 2150 1480 2080 1480 2002 Z"/>
        <path d="M 1850 1998 C 1850 2060 1862 2110 1880 2110 C 1898 2110 1910 2060 1910 1995 Z"/>
      </g>
    </g>
  </g>

  <!-- Side B. Same mapping, centered at (6375, 1750). Bowl matches l.svg. -->
  <g id="side-b" transform="translate(6375 1750) scale(1.3) translate(-1625 -1680)">
    <text x="1625" y="950" font-family="'Archivo Black', 'Arial Black', sans-serif" font-size="440" fill="#141414" text-anchor="middle" textLength="2150" lengthAdjust="spacingAndGlyphs">L nibbles</text>
    <g stroke-linecap="round" stroke-linejoin="round">
      <!-- empty bowl interior: Chalk with an Ink rim -->
      <ellipse cx="1625" cy="1900" rx="775" ry="110" fill="#F2F2EE" stroke="#141414" stroke-width="40"/>
      <!-- a few loose sesame seeds left behind -->
      <g fill="#141414">
        <ellipse cx="1380" cy="1935" rx="17" ry="9" transform="rotate(-20 1380 1935)"/>
        <ellipse cx="1480" cy="1880" rx="17" ry="9" transform="rotate(35 1480 1880)"/>
        <ellipse cx="2040" cy="1950" rx="17" ry="9" transform="rotate(10 2040 1950)"/>
      </g>
      <!-- the one sad piece, tilted, off-center -->
      <g transform="translate(1800 1915) rotate(22) scale(0.6)">
        <use xlink:href="#chunk-shape" href="#chunk-shape" fill="#F2C14E" stroke="#141414" stroke-width="40" stroke-linejoin="round"/>
        <path d="M -85 -60 C -45 -88 15 -90 60 -72" fill="none" stroke="#F2F2EE" stroke-width="30" stroke-linecap="round"/>
        <ellipse cx="20" cy="30" rx="22" ry="12" fill="#141414" transform="rotate(5 20 30)"/>
      </g>
      <!-- bowl front and foot, Ink -->
      <rect x="1350" y="2560" width="550" height="160" rx="40" fill="#141414"/>
      <path d="M 850 1900 A 775 110 0 0 0 2400 1900 C 2380 2350 2100 2620 1625 2620 C 1150 2620 870 2350 850 1900 Z" fill="#141414"/>
      <path d="M 900 1945 A 725 100 0 0 0 2350 1945" fill="none" stroke="#F2F2EE" stroke-width="18"/>
    </g>
  </g>
</svg>
