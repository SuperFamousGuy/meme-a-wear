<?xml version="1.0" encoding="UTF-8"?>
<!--
  L Nibbles sticker, kiss-cut, 3 x 3 in, digital print. Pair: w.svg.
  Hand-written SVG fallback: Higgsfield had no image credits (2026-11-02).
  Units: 1000 per inch. Canvas 3.25 in = 3 in trim + 0.125 in bleed per side.
  Layers, bottom to top:
    bleed       Chalk face, extends 0.125 in past the cut line
    caption     "L nibbles", Archivo Black, Ink. Convert to outlines before print.
    bowl        original flat drawing: the same bowl, empty but for one sad piece
    CutContour  kiss-cut line. Non-printing. Hide before RIP or map to the printer's cut spot.
  Palette: Ink #141414, Chalk #F2F2EE, Yolk #F2C14E (one non-text chunk only).
  Bowl, rim, and caption positions match w.svg exactly.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="3.25in" height="3.25in" viewBox="0 0 3250 3250">
  <title>L Nibbles Sticker</title>
  <defs>
    <rect id="cut" x="125" y="125" width="3000" height="3000" rx="300" ry="300"/>
    <path id="chunk-shape" d="M -150 -20 C -150 -100 -60 -125 10 -115 C 90 -110 155 -70 150 10 C 145 85 70 115 -10 112 C -100 108 -150 60 -150 -20 Z"/>
  </defs>

  <g id="bleed">
    <rect x="0" y="0" width="3250" height="3250" fill="#F2F2EE"/>
  </g>

  <g id="caption">
    <text x="1625" y="950" font-family="'Archivo Black', 'Arial Black', sans-serif" font-size="440" fill="#141414" text-anchor="middle" textLength="2150" lengthAdjust="spacingAndGlyphs">L nibbles</text>
  </g>

  <g id="bowl" stroke-linecap="round" stroke-linejoin="round">
    <!-- empty bowl interior: Chalk with an Ink rim -->
    <ellipse cx="1625" cy="1900" rx="775" ry="110" fill="#F2F2EE" stroke="#141414" stroke-width="40"/>
    <!-- a few loose sesame seeds left behind -->
    <g fill="#141414">
      <ellipse cx="1380" cy="1935" rx="17" ry="9" transform="rotate(-20 1380 1935)"/>
      <ellipse cx="1480" cy="1880" rx="17" ry="9" transform="rotate(35 1480 1880)"/>
      <ellipse cx="2040" cy="1950" rx="17" ry="9" transform="rotate(10 2040 1950)"/>
    </g>
    <!-- the one sad piece, tilted, off-center -->
    <g transform="translate(1800 1915) rotate(22) scale(0.6)">
      <use xlink:href="#chunk-shape" href="#chunk-shape" fill="#F2C14E" stroke="#141414" stroke-width="40" stroke-linejoin="round"/>
      <path d="M -85 -60 C -45 -88 15 -90 60 -72" fill="none" stroke="#F2F2EE" stroke-width="30" stroke-linecap="round"/>
      <ellipse cx="20" cy="30" rx="22" ry="12" fill="#141414" transform="rotate(5 20 30)"/>
    </g>
    <!-- bowl front and foot, Ink; same shape and position as w.svg -->
    <rect x="1350" y="2560" width="550" height="160" rx="40" fill="#141414"/>
    <path d="M 850 1900 A 775 110 0 0 0 2400 1900 C 2380 2350 2100 2620 1625 2620 C 1150 2620 870 2350 850 1900 Z" fill="#141414"/>
    <path d="M 900 1945 A 725 100 0 0 0 2350 1945" fill="none" stroke="#F2F2EE" stroke-width="18"/>
  </g>

  <g id="CutContour">
    <!-- Non-printing kiss-cut line, 0.125 in inside the bleed edge. -->
    <use xlink:href="#cut" href="#cut" fill="none" stroke="#FF00FF" stroke-width="4"/>
  </g>
</svg>
